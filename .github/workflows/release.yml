name: Release

# Fires on version tags (v0.1.0, v1.2.3, ...). Builds everything
# distributable — cross-platform binaries, .deb/.rpm packages, the install
# ISO — and publishes them all as a single GitHub Release.
on:
  push:
    tags:
      - 'v*'

jobs:
  web:
    name: Frontend build & check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: faroos-web-dist
          path: internal/webui/dist

  go-build-matrix:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: faroos-web-dist
          path: internal/webui/dist
      - name: Build server + agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "dist/faroos-server-$GOOS-$GOARCH$ext" ./cmd/server
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "dist/faroos-agent-$GOOS-$GOARCH$ext" ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: faroos-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  native-packages:
    name: Native packages (linux/${{ matrix.goarch }})
    needs: go-build-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: faroos-linux-${{ matrix.goarch }}
          path: dist
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build deb and rpm packages
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          version_num="${VERSION#v}"
          mv "dist/faroos-agent-linux-$GOARCH" dist/faroos-agent
          mv "dist/faroos-server-linux-$GOARCH" dist/faroos-server
          for component in agent server; do
            for packager in deb rpm; do
              nfpm package \
                --config "packaging/nfpm.$component.yaml" \
                --packager "$packager" \
                --target "dist/faroos-$component-$version_num-$GOARCH.$packager"
            done
          done
          rm dist/faroos-agent dist/faroos-server
      - uses: actions/upload-artifact@v4
        with:
          name: faroos-native-packages-linux-${{ matrix.goarch }}
          path: |
            dist/*.deb
            dist/*.rpm

  iso:
    name: Build install ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso isolinux
      - name: Build ISO
        run: ./packaging/iso/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: faroos-install-iso
          path: |
            packaging/iso/dist/*.iso
            packaging/iso/dist/*.CREDENTIALS.txt

  publish:
    name: Publish GitHub Release
    needs: [go-build-matrix, native-packages, iso]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts into one release directory
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name 'faroos-server-*' -o \
            -name 'faroos-agent-*' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.iso' -o \
            -name '*.CREDENTIALS.txt' \
          \) -exec cp {} release/ \;
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
